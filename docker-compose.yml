version: '3.8'

services:
  wg-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wg-agent
    ports:
      - "9999:9999"
    environment:
      - API_KEY=${API_KEY:-change-me-in-production}
      - HOST=0.0.0.0
      - PORT=9999
      - WG_INTERFACE=wg0
      - LOG_LEVEL=info
      - PUBLIC_KEY_PATH=/etc/wireguard/publickey
    volumes:
      - /etc/wireguard:/etc/wireguard:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - wg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  wg-network:
    driver: bridge
